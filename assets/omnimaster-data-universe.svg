<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="480" viewBox="0 0 1440 480" role="img" aria-labelledby="title desc">
<title id="title">Cayelaem Jantjies — The OmniMaster</title>
<desc id="desc">A cinematic neon isometric data city: glowing data cubes flow from source systems through an analytics core into dashboards and human decisions.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07151B"/><stop offset=".52" stop-color="#0C2029"/><stop offset="1" stop-color="#102A32"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF0B0"/><stop offset=".48" stop-color="#F7CF80"/><stop offset="1" stop-color="#C8833E"/></linearGradient>
 <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C5FFF1"/><stop offset=".48" stop-color="#83E1D0"/><stop offset="1" stop-color="#38A99D"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E6C7FF"/><stop offset=".5" stop-color="#B47CEC"/><stop offset="1" stop-color="#6850BA"/></linearGradient>
 <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173B45" stop-opacity=".96"/><stop offset="1" stop-color="#0B1D25" stop-opacity=".98"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#40D6C0" stop-opacity=".3"/><stop offset=".58" stop-color="#40D6C0" stop-opacity=".09"/><stop offset="1" stop-color="#40D6C0" stop-opacity="0"/></radialGradient>
 <radialGradient id="haloGold"><stop stop-color="#F7CF80" stop-opacity=".25"/><stop offset="1" stop-color="#F7CF80" stop-opacity="0"/></radialGradient>
 <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13"/></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
 <pattern id="stars" width="83" height="71" patternUnits="userSpaceOnUse"><circle cx="5" cy="13" r="1" fill="#D3F5EE" opacity=".26"/><circle cx="42" cy="48" r=".8" fill="#F7CF80" opacity=".35"/><circle cx="72" cy="22" r=".7" fill="#D3F5EE" opacity=".2"/></pattern>
 <pattern id="floor" width="46" height="28" patternUnits="userSpaceOnUse" patternTransform="skewY(-27)"><path d="M46 0H0V28" fill="none" stroke="#83E1D0" stroke-opacity=".14" stroke-width="1"/></pattern>
</defs>
<rect width="1440" height="480" rx="28" fill="url(#bg)"/>
<rect width="1440" height="480" rx="28" fill="url(#stars)"/>
<ellipse cx="1065" cy="228" rx="390" ry="276" fill="url(#halo)"/>
<ellipse cx="1242" cy="153" rx="182" ry="160" fill="url(#haloGold)"/>
<circle cx="1102" cy="218" r="161" fill="none" stroke="#83E1D0" stroke-opacity=".14"/>
<circle cx="1102" cy="218" r="126" fill="none" stroke="#F7CF80" stroke-opacity=".14" stroke-dasharray="2 11"/>
<path d="M694 353 1084 137 1430 336 1041 471Z" fill="#071419" opacity=".55" filter="url(#shadow)"/>
<path d="M692 335 1086 109 1438 312 1045 454Z" fill="url(#floor)" opacity=".78"/>
<!-- orbit paths -->
<g fill="none" stroke-linecap="round">
 <path d="M752 285 866 217 983 284 1098 217 1212 284 1342 207" stroke="#83E1D0" stroke-width="2" stroke-opacity=".72"/>
