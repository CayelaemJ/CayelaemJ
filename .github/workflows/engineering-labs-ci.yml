name: OmniMaster Library, Reliability and Applied Learning CI

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "README.md"
      - "docs/OMNIMASTER_HANDBOOK.md"
      - "docs/handbook/**"
      - "docs/OMNIMASTER_FIELD_GUIDE.md"
      - "docs/field-guide/**"
      - "docs/OMNIMASTER_FULLSTACK_PLAYBOOK.md"
      - "docs/OMNIMASTER_ACADEMY.md"
      - "docs/academy/**"
      - "docs/OMNIMASTER_OPERATING_MANUAL.md"
      - "docs/personal/**"
      - "docs/OMNIMASTER_ARCADE.md"
      - "docs/OMNIMASTER_BUILD_WITH_ME.md"
      - "docs/build-with-me/**"
      - "docs/OMNIMASTER_HUMAN_INTERFACE.md"
      - "docs/OMNIMASTER_RELIABILITY_FIELD_GUIDE.md"
      - "docs/reliability/**"
      - "docs/human-interface/**"
      - "docs/THIRTY_DAY_ENGINEERING_EXPEDITION.md"
      - "docs/interactive/**"
      - "docs/ACCESS_AND_SHARING.md"
      - ".github/scripts/verify_handbook_links.py"
      - ".github/workflows/engineering-labs-ci.yml"
  pull_request:
    paths:
      - "projects/**"
      - "README.md"
      - "docs/OMNIMASTER_HANDBOOK.md"
      - "docs/handbook/**"
      - "docs/OMNIMASTER_FIELD_GUIDE.md"
      - "docs/field-guide/**"
      - "docs/OMNIMASTER_ACADEMY.md"
      - "docs/academy/**"
      - "docs/OMNIMASTER_OPERATING_MANUAL.md"
      - "docs/personal/**"
      - "docs/OMNIMASTER_ARCADE.md"
      - "docs/OMNIMASTER_BUILD_WITH_ME.md"
      - "docs/build-with-me/**"
      - "docs/OMNIMASTER_HUMAN_INTERFACE.md"
      - "docs/human-interface/**"
      - "docs/THIRTY_DAY_ENGINEERING_EXPEDITION.md"
      - "docs/interactive/**"
      - ".github/scripts/verify_handbook_links.py"
      - ".github/workflows/engineering-labs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-labs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Seven Python project suites, offline study room and docs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all engineering lab tests (no dependencies or external services)
        shell: bash
        run: |
          set -euo pipefail
          for lab in projects/cdc-replay-lab projects/data-quality-contracts projects/sql-query-plans projects/ai-output-evaluation projects/omnimaster-incident-academy projects/data-to-decision-platform projects/reliability-recovery-lab; do
            echo "::group::${lab}"
            (cd "$lab" && python -m unittest discover -v)
            echo "::endgroup::"
          done
      - name: Test bundled HTML lessons and generated PDF
        run: node docs/interactive/test_library_worker.mjs
      - name: Verify offline study room HTML
        run: |
          cd docs/interactive
          python -m unittest discover -v
      - name: Verify seven volumes, reliability recovery and learning-library navigation
        run: python .github/scripts/verify_handbook_links.py
