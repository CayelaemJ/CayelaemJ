 <circle cx="816" cy="153" r="5" fill="#F7CF80"/><circle cx="923" cy="215" r="4" fill="#F7CF80"/><circle cx="1144" cy="218" r="4" fill="#F7CF80"/><circle cx="1375" cy="218" r="5" fill="#F7CF80"/>
 <circle cx="797" cy="344" r="4" fill="#B47CEC"/><circle cx="1018" cy="344" r="4" fill="#B47CEC"/><circle cx="1240" cy="344" r="4" fill="#B47CEC"/>
</g>
