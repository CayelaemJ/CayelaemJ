 <path d="m108 19 21 11" stroke="#F7CF80" stroke-width="2" fill="none"/>
 <circle cx="171" cy="11" r="5" fill="#83E1D0"/>
</g>
<!-- connector labels -->
<g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">
 <text x="757" y="311" fill="#A9EBDD">SOURCE</text>
 <text x="1006" y="322" fill="#F7CF80">TRUSTED DATA</text>
 <text x="1223" y="287" fill="#D8C3FF">PRODUCT</text>
 <text x="1144" y="65" fill="#C5FFF1" font-size="9">INSIGHT ENGINE</text>
</g>
<!-- copy -->
<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <rect x="72" y="65" width="245" height="27" rx="13.5" fill="#83E1D0" fill-opacity=".12" stroke="#83E1D0" stroke-opacity=".42"/>
 <circle cx="91" cy="78.5" r="4" fill="#83E1D0"/>
 <text x="105" y="83" fill="#B9F5E9" font-size="11" font-weight="700" letter-spacing="2.2">DATA × PRODUCTS × IMPACT</text>
 <text x="66" y="181" fill="#F7F9F6" font-size="72" font-weight="800" letter-spacing="-3">THE</text>
 <text x="66" y="258" fill="url(#gold)" font-size="78" font-weight="850" letter-spacing="-3">OMNIMASTER</text>
 <text x="72" y="306" fill="#C8DAD9" font-size="20" font-weight="500">Cayelaem Jantjies</text>
 <text x="72" y="352" fill="#83E1D0" font-size="15" font-weight="700" letter-spacing="1.25">DATA ENGINEER  ·  FULL-STACK BUILDER</text>
 <text x="72" y="381" fill="#F7CF80" font-size="15" font-weight="700" letter-spacing="1.25">ANALYTICS ENGINEER  ·  APPLIED AI</text>
 <text x="72" y="431" fill="#94AAA9" font-size="12" letter-spacing="1.5">I ENGINEER THE PIPELINE, THE PRODUCT AND THE DECISION.</text>
</g>
<rect x="1" y="1" width="1438" height="478" rx="27" fill="none" stroke="#B4D5D1" stroke-opacity=".22"/>
</svg>