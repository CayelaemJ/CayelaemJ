 <path d="m988 188 61 35 61-35-61-35z" fill="url(#gold)"/>
 <path d="M1049 223v70l61-35v-70z" fill="#9C673B"/>
 <path d="M988 188v70l61 35v-70z" fill="#BD874F"/>
 <!-- output cube -->
 <path d="m1219 211 44-25 44 25v50l-44 26-44-26z" fill="#473A69"/>
 <path d="m1219 211 44 25 44-25-44-25z" fill="url(#violet)"/>
 <path d="M1263 236v51l44-26v-50z" fill="#66529C"/>
 <path d="M1219 211v50l44 26v-51z" fill="#856BBB"/>
</g>
<!-- floating glass dashboard -->
<g transform="translate(1134 77)">
 <path d="M0 23 105 0l94 53-105 25z" fill="#06141A" opacity=".62"/>
 <path d="m0 10 105-24 94 53-105 25z" fill="url(#panel)" stroke="#83E1D0" stroke-opacity=".5"/>
 <path d="m16 11 81-18 74 42-81 19z" fill="#102E36" stroke="#F7CF80" stroke-opacity=".32"/>
 <path d="m32 16 18-4 0 17-18 4z" fill="#83E1D0" opacity=".78"/>
 <path d="m57 10 18-4 0 17-18 4z" fill="#F7CF80" opacity=".92"/>
 <path d="m82 5 18-4 0 17-18 4z" fill="#B47CEC" opacity=".9"/>
